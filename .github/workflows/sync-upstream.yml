name: Sync upstream

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '23 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'cyriusweng/wechat-intelligence-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream main while preserving local commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/merge-upstream" -f branch=main

      - name: Keep scheduled synchronization active
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 3 1 * *'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import base64
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = 'https://api.github.com/repos/' + os.environ['GH_REPO'] + '/contents/.github/upstream-sync-heartbeat.json'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          payload = {
              'message': 'chore: keep upstream synchronization active',
              'branch': 'main',
              'content': base64.b64encode((json.dumps({
                  'upstream': 'Rion-Wu-tech/wechat-intelligence-hub',
                  'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              }, indent=2) + '\n').encode()).decode(),
          }
          try:
              with urllib.request.urlopen(urllib.request.Request(endpoint + '?ref=main', headers=headers), timeout=30) as response:
                  payload['sha'] = json.load(response)['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          request = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), headers=headers, method='PUT')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          print('Keepalive commit:', result['commit']['sha'])
